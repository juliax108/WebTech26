<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teilnehmerin Registrierung</title>
  <!-- Bootstrap 5 CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
</head>
<body class="bg-light d-flex justify-content-center gap-4 p-4 flex-wrap">

  <!-- Registrierungsformular -->
  <div class="card shadow-sm" style="width: 400px">
    <div class="card-body">
      <h5 class="card-title mb-4">Teilnehmerin Registrierung</h5>

      <form id="registrierungForm" novalidate>

        <div class="row mb-3">
          <div class="col">
            <label for="firstName" class="form-label">Vorname</label>
            <input type="text" class="form-control" id="firstName" placeholder="Vorname" required />
            <div class="invalid-feedback">Bitte Vorname eingeben.</div>
          </div>
          <div class="col">
            <label for="lastName" class="form-label">Nachname</label>
            <input type="text" class="form-control" id="lastName" placeholder="Nachname" required />
            <div class="invalid-feedback">Bitte Nachname eingeben.</div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col">
            <label for="email" class="form-label">E-Mail</label>
            <input type="email" class="form-control" id="email" placeholder="E-Mail" required />
            <div class="invalid-feedback">Bitte gültige E-Mail eingeben.</div>
          </div>
          <div class="col">
            <label for="ipAddress" class="form-label">IP-Adresse</label>
            <input
              type="text"
              class="form-control"
              id="ipAddress"
              placeholder="z.B. 192.168.1.1"
              pattern="^(\d{1,3}\.){3}\d{1,3}$"
              required
            />
            <div class="invalid-feedback">Bitte gültige IP-Adresse eingeben.</div>
          </div>
        </div>

        <div class="mb-3">
          <label for="vorname2" class="form-label">Vorname (2)</label>
          <input type="text" class="form-control" id="vorname2" placeholder="Vorname" required />
          <div class="invalid-feedback">Bitte Vorname eingeben.</div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary" id="abbrechenBtn">Abbrechen</button>
          <button type="submit" class="btn btn-primary" id="registrierenBtn">Registrieren</button>
        </div>

      </form>
    </div>
  </div>

  <!-- Ausgabe der eingegebenen Werte -->
  <div class="card shadow-sm" style="width: 350px" id="ausgabeCard">
    <div class="card-body">
      <h5 class="card-title mb-3">Eingegebene Werte</h5>
      <table class="table table-sm table-borderless mb-0" id="ausgabeTabelle">
        <tbody>
          <tr><th scope="row">Vorname:</th><td id="outVorname">—</td></tr>
          <tr><th scope="row">Nachname:</th><td id="outNachname">—</td></tr>
          <tr><th scope="row">E-Mail:</th><td id="outEmail">—</td></tr>
          <tr><th scope="row">IP-Adresse:</th><td id="outIP">—</td></tr>
          <tr><th scope="row">Vorname (2):</th><td id="outVorname2">—</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const form = document.getElementById('registrierungForm');

    // Registrieren-Button: Validierung + Daten anzeigen
    form.addEventListener('submit', function (event) {
      event.preventDefault(); // submit-Event unterdrücken

      // Bootstrap-Validierung auslösen
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      // Eingaben in die Ausgabe-Tabelle schreiben
      document.getElementById('outVorname').textContent   = document.getElementById('firstName').value;
      document.getElementById('outNachname').textContent  = document.getElementById('lastName').value;
      document.getElementById('outEmail').textContent     = document.getElementById('email').value;
      document.getElementById('outIP').textContent        = document.getElementById('ipAddress').value;
      document.getElementById('outVorname2').textContent  = document.getElementById('vorname2').value;

      // Validierungsklassen zurücksetzen
      form.classList.remove('was-validated');
    });

    // Abbrechen-Button: alle Felder leeren und Validierung zurücksetzen
    document.getElementById('abbrechenBtn').addEventListener('click', function () {
      form.reset();
      form.classList.remove('was-validated');

      // Ausgabe-Tabelle zurücksetzen
      ['outVorname', 'outNachname', 'outEmail', 'outIP', 'outVorname2'].forEach(id => {
        document.getElementById(id).textContent = '—';
      });
    });
  </script>

</body>
</html>
