<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teilnehmerin Registrierung</title>
  <!-- Bootstrap 5 CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">

  <div class="card shadow-sm" style="width: 400px;">
    <div class="card-body">
      <h5 class="card-title mb-4">Teilnehmerin Registrierung</h5>

      <div class="row mb-3">
        <div class="col">
          <label for="firstName" class="form-label">First name</label>
          <input type="text" class="form-control" id="firstName" placeholder="First name" />
        </div>
        <div class="col">
          <label for="lastName" class="form-label">Last name</label>
          <input type="text" class="form-control" id="lastName" placeholder="Last name" />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col">
          <label for="email" class="form-label">E-Mail</label>
          <input type="email" class="form-control" id="email" placeholder="E-Mail" />
        </div>
        <div class="col">
          <label for="ipAddress" class="form-label">IP-Address</label>
          <input type="text" class="form-control" id="ipAddress" placeholder="IP-Address" />
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary btn-sm">Abbrechen</button>
        <button type="button" class="btn btn-success btn-sm">Registrieren</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
