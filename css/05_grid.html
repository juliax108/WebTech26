<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Grid</title>
    <style>

        .rosa {
            background-color: rgb(241, 177, 226);
            opacity: 0.5;
            border: 2px solid rgb(219, 139, 206);
            border-radius: 5px;
            padding: 30px;
        }

        .wrapper{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2%;
        }

        .one{
            grid-column: 1/3;
            grid-row: 1/3;
        }

        .two{
            grid-column: 2/3;
            grid-row: 1/2;
        }

    </style>
</head>
<body>
    <header>
        <h1>CSS-Grid</h1>
    </header>
    <main class="wrapper">
        <div class="one rosa">One</div>
        <div class="two rosa">Two</div>
        <div class="three rosa">Three</div>
        <div class="four rosa">Four</div>
        <div class="five rosa">Five</div>
        <div class="six rosa">Six</div>
    </main>
    <footer>
        <p><a href="https://www.w3schools.com/cssref/pr_grid.php">grid</a></p>
        <p><a href="https://www.w3schools.com/cssref/pr_grid-template-columns.php">grid-template-columns</a></p>
        <p><a href="https://css-tricks.com/introduction-fr-css-unit/">fr - fraction</a></p>
        <p><a href="./index.html">Zurück</a></p>
    </footer>

</body>
</html>
